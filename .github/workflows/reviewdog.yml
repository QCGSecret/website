name: reviewdog
on: [pull_request]
jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: mongolyy/reviewdog-action-biome@aed0b35b89586ed70a61e9749f2edd69c89e16fd # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
